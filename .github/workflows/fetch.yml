name: Fetch Taylor Swift setlists

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SETLIST_API_KEY: ${{ secrets.SETLIST_API_KEY }}
        run: python scraper.py

      - name: Commit data
        run: |
          git config user.name "taylor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: fetch setlists $(date -u +%F)"
            git push
          fi
